<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="128" fill="#0D9488"/>
  <circle cx="256" cy="256" r="210" fill="#14B8A6" opacity="0.25"/>
  <!-- Flower Petals -->
  <g transform="translate(256, 256)">
    <!-- 8 Petals in Circular Array -->
    <ellipse cx="0" cy="-90" rx="38" ry="65" fill="#FAF6F4" opacity="0.95"/>
    <ellipse cx="63.6" cy="-63.6" rx="38" ry="65" transform="rotate(45 63.6 -63.6)" fill="#FAF6F4" opacity="0.95"/>
    <ellipse cx="90" cy="0" rx="38" ry="65" transform="rotate(90 90 0)" fill="#FAF6F4" opacity="0.95"/>
    <ellipse cx="63.6" cy="63.6" rx="38" ry="65" transform="rotate(135 63.6 63.6)" fill="#FAF6F4" opacity="0.95"/>
    <ellipse cx="0" cy="90" rx="38" ry="65" transform="rotate(180 0 90)" fill="#FAF6F4" opacity="0.95"/>
    <ellipse cx="-63.6" cy="63.6" rx="38" ry="65" transform="rotate(225 -63.6 63.6)" fill="#FAF6F4" opacity="0.95"/>
    <ellipse cx="-90" cy="0" rx="38" ry="65" transform="rotate(270 -90 0)" fill="#FAF6F4" opacity="0.95"/>
    <ellipse cx="-63.6" cy="-63.6" rx="38" ry="65" transform="rotate(315 -63.6 -63.6)" fill="#FAF6F4" opacity="0.95"/>
    
    <!-- Flower Center Core -->
    <circle cx="0" cy="0" r="48" fill="#FBBF24"/>
    <circle cx="0" cy="0" r="38" fill="#F59E0B"/>
    <circle cx="0" cy="0" r="18" fill="#FCD34D"/>
  </g>
</svg>
